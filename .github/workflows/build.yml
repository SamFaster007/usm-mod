name: Build ASI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile
        run: cl /O2 /MT /LD main.cpp user32.lib comctl32.lib /Fe:HardcoreMod.asi
      - uses: actions/upload-artifact@v4
        with:
          name: HardcoreMod
          path: HardcoreMod.asi
